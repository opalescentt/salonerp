[project]
name = "salonerp"
version = "0.1.0"
description = "Multi-tenant salon ERP — booking core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle basics, I = import sorting, UP = pyupgrade,
# B = bugbear (catches common footguns), SIM = simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# Pydantic/SQLAlchemy plugins keep mypy honest about ORM-mapped attributes
# and model validators instead of treating them as Any.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --- Module boundary enforcement -------------------------------------------
# Modules may only import another module's `service` (business logic entry
# point) or `schemas` (data shapes) — never its `models`/`repository`
# directly. This is the "modules call each other's service layer, never
# each other's tables" rule from CLAUDE.md, enforced instead of trusted.
[tool.importlinter]
root_package = "salonerp"

[[tool.importlinter.contracts]]
name = "Modules only reach each other through service/schemas"
type = "forbidden"
source_modules = ["salonerp.modules"]
forbidden_modules = ["salonerp.modules"]
# NOTE: import-linter's "forbidden" contract type is blunt (whole-package,
# not attribute-level), so this starter config forbids cross-module imports
# entirely. Once there are 2+ modules calling each other, swap to a
# `layers` or `independence` contract scoped per-module, or add explicit
# per-pair allowlists — see https://import-linter.readthedocs.io/.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salonerp"]
